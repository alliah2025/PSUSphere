{% extends 'base.html' %}
{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">Colleges</h4>

    <a href="{% url 'college-add' %}" class="btn btn-success btn-rounded mb-3">
      Add College
    </a>
    <div class="col-md-12">
    <form method="get" class="row g-2 align-items-center">
        <div class="col-auto">
            <label for="smallSelect" class="col-form-label">Sort by</label>
        </div>
        <div class="col-auto">
            <select class="form-control form-control-sm" id="smallSelect" name="sort_by">
                <option value="college_name" {% if request.GET.sort_by == "college_name" %}selected{% endif %}>College Name</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-sm btn-rounded">Sort</button>
        </div>
    </form>
</div>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>College Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for college in colleges %}
        <tr>
          <td>{{ college.college_name }}</td>
          <td>
            <a href="/colleges/{{ college.id }}">Edit</a> |
            <a href="/colleges/{{ college.id }}/delete" class="text-danger">Delete</a>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="2" class="text-center">No records found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    {% include 'includes/pagination.html' %}
  </div>
</div>
{% endblock %}
