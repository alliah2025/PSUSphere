{% extends 'base.html' %}
{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">
      {% if object %}Update Org Member{% else %}Add Org Member{% endif %}
    </h4>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/form.html' %}
      <button type="submit" class="btn btn-primary btn-rounded">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
